<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#800000">
    <title>تحديث وتطوير البرنامج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #fbf9f5; /* لون الخلفية الهادئ من كودك السابق */
        }
        /* حركة دوران خفيفة لأيقونة التطوير */
        @keyframes gear-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin-gear {
            animation: gear-spin 8s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center transform transition-all duration-300 hover:scale-[1.01]">
        
        <div class="w-24 h-24 bg-[#800000]/10 text-[#800000] rounded-full flex items-center justify-center mx-auto mb-6 relative">
            <span class="material-symbols-outlined text-5xl spin-gear select-none">settings</span>
            <span class="material-symbols-outlined text-2xl absolute bottom-5 right-5 text-[#fed65b] select-none">build</span>
        </div>

        <h1 class="text-2xl font-black text-gray-800 mb-3 tracking-tight">
            نعتذر عن توقف البرنامج مؤقتاً
        </h1>

        <p class="text-gray-600 leading-relaxed mb-6 font-medium">
            البرنامج حالياً في مرحلة <span class="text-[#800000] font-bold">التحديث والتطوير</span>، وجاري العمل المكثف على إصلاح بعض المشكلات التقنية لتحسين تجربتكم وضمان دقة البيانات.
        </p>

        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mb-6 relative">
            <div class="bg-gradient-to-r from-[#fed65b] to-[#800000] h-full rounded-full w-2/3 animate-pulse"></div>
        </div>

        <div class="text-sm text-gray-500 bg-gray-50 border border-gray-100 rounded-xl p-3 mb-6 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-xl text-[#fed65b]">verified_user</span>
            <span>سنعود للعمل بكفاءة أعلى قريباً جداً إن شاء الله.</span>
        </div>

        <div class="flex flex-col gap-2">
            <button onclick="window.location.reload();" class="w-full bg-[#800000] hover:bg-[#570000] text-white font-bold py-3 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-[#800000]/20">
                <span class="material-symbols-outlined text-xl">refresh</span>
                إعادة تحميل الصفحة
            </button>
        </div>

    </div>

</body>
</html>
