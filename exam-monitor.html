<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#800000">
<title>متابعة امتحان الطقس — شمامسة ٢٠٢٦</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Literata:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:#f5f0ea;color:#1a0000;direction:rtl;min-height:100vh;padding-bottom:32px}

/* Header */
.hdr{background:linear-gradient(135deg,#800000,#570000);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(128,0,0,.2)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-family:'Literata',serif;font-size:16px;color:#fed65b;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.hdr-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);padding:5px 12px;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:800;cursor:pointer}
.cd{font-size:10px;color:rgba(255,255,255,.5);font-weight:700}

/* Login */
#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(160deg,#800000,#570000,#3d0000)}
#loginScreen.hidden{display:none}
.login-sheet{background:#fbf9f5;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 22px 44px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.l-handle{width:40px;height:4px;background:#e2bfb9;border-radius:4px;margin:0 auto 18px}
.l-icon{font-size:40px;text-align:center;margin-bottom:8px}
.l-title{font-size:19px;font-weight:900;color:#570000;text-align:center;margin-bottom:18px}
.l-lbl{font-size:10px;font-weight:800;color:#5a413d;letter-spacing:.1em;margin-bottom:5px;display:block}
.l-inp{width:100%;background:#f5f3ef;border:1.5px solid #e2bfb9;border-radius:12px;padding:12px 14px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;color:#1a0000;outline:none;transition:.15s;margin-bottom:10px}
.l-inp:focus{border-color:#800000;background:#fff}
.l-err{display:none;background:#fff5f5;border:1px solid #fca5a5;color:#ba1a1a;border-radius:10px;padding:8px;font-size:12px;font-weight:700;text-align:center;margin-bottom:10px}
.l-btn{width:100%;background:linear-gradient(135deg,#800000,#570000);color:#fff;border:none;border-radius:14px;padding:14px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(128,0,0,.25)}

/* View tabs */
.view-tabs{background:#fff;border-bottom:1px solid rgba(128,0,0,.1);display:none;gap:4px;padding:8px 14px}
.vt{padding:7px 16px;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:800;border:none;cursor:pointer;background:transparent;color:#5a413d;transition:.15s}
.vt.on{background:#800000;color:#fff}

/* Controls */
.controls{display:none;flex-wrap:wrap;gap:8px;padding:10px 14px;align-items:center;background:#f9f5f0;border-bottom:1px solid rgba(128,0,0,.08)}
.lvl-tabs{display:flex;gap:5px;flex-wrap:wrap}
.lvl-tab{background:#fff;border:1.5px solid rgba(128,0,0,.15);border-radius:18px;padding:6px 13px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:800;color:#800000;cursor:pointer;transition:.15s;white-space:nowrap}
.lvl-tab.on{background:#800000;color:#fff;border-color:#800000}
.ch-sel{background:#fff;border:1.5px solid rgba(128,0,0,.15);border-radius:18px;padding:6px 12px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:800;color:#800000;outline:none;cursor:pointer;max-width:180px}
.srch{background:#fff;border:1.5px solid rgba(128,0,0,.15);border-radius:18px;padding:6px 12px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;color:#1a0000;outline:none;min-width:130px;flex:1}
.ref-btn{background:#800000;color:#fff;border:none;border-radius:18px;padding:6px 14px;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:800;cursor:pointer;margin-right:auto;white-space:nowrap}

/* KPIs */
.kpis{display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}
.kpi{background:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(128,0,0,.08)}
.kpi-n{font-size:26px;font-weight:900}
.kpi-l{font-size:10px;font-weight:800;color:#9c7c78;margin-top:2px}

/* Table */
.tcard{background:#fff;border-radius:14px;margin:0 14px 14px;box-shadow:0 2px 10px rgba(128,0,0,.06);border:1px solid rgba(128,0,0,.08);overflow:hidden;display:none}
.tcard-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#faf5ef;border-bottom:1px solid rgba(128,0,0,.08)}
.tcard-title{font-size:13px;font-weight:900;color:#5a0000}
.exp-btn{background:none;border:1.5px solid rgba(128,0,0,.2);border-radius:8px;padding:4px 12px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:800;color:#800000;cursor:pointer}
.exp-btn:hover{background:#800000;color:#fff}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:#5a0000;color:#fff;padding:8px 10px;text-align:right;font-weight:900;font-size:11px;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:.5px solid #f0e8e0;text-align:right}
.tbl tbody tr:nth-child(even) td{background:#faf8f5}
.tbl td.tm{text-align:center;font-size:10px;color:#9c7c78}
.new-badge{background:#16A34A;color:#fff;font-size:9px;font-weight:900;padding:1px 6px;border-radius:10px;margin-right:4px}
.empty{text-align:center;padding:28px;color:#bbb;font-size:13px;font-weight:700}

/* Summary */
#summaryView{display:none;padding:0 14px 14px}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.sum-card{background:#fff;border-radius:12px;border:1px solid rgba(128,0,0,.08);overflow:hidden}
.sum-head{background:linear-gradient(90deg,rgba(128,0,0,.07),transparent);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.sum-church{font-size:12px;font-weight:900;color:#5a0000}
.sum-total{font-size:18px;font-weight:900;color:#800000}
.sum-genders{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(128,0,0,.06)}
.sum-g{padding:8px;text-align:center;border-left:1px solid rgba(128,0,0,.06)}
.sum-g:last-child{border-left:none}
.sum-gn{font-size:16px;font-weight:900}
.sum-gl{font-size:9px;color:#9c7c78;font-weight:700;margin-top:1px}
.sum-bar{height:4px;margin:0 14px 10px;background:#f0e8e0;border-radius:4px;overflow:hidden}
.sum-fill{height:100%;background:linear-gradient(90deg,#1A56DB,#60a5fa);border-radius:4px}

/* Utils */
.last-upd{text-align:center;font-size:10px;color:#bbb;font-weight:700;padding:4px}
.err-msg{background:#fff5f5;border-radius:10px;padding:10px 14px;margin:0 14px 10px;font-size:12px;font-weight:700;color:#ba1a1a;border:1px solid #fca5a5;display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(87,0,0,.2);border-top-color:#800000;border-radius:50%;animation:sp .7s linear infinite}
.spin-w{border-color:rgba(255,255,255,.3);border-top-color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-sheet">
    <div class="l-handle"></div>
    <div class="l-icon">📋</div>
    <div class="l-title">متابعة امتحان الطقس</div>
    <label class="l-lbl">اسم المستخدم</label>
    <input class="l-inp" id="loginUser" type="text" autocapitalize="off" autocomplete="username" placeholder="username">
    <label class="l-lbl">كلمة السر</label>
    <input class="l-inp" id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="l-err" id="loginErr"></div>
    <button class="l-btn" id="loginBtn" onclick="doLogin()">🔑 دخول</button>
  </div>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">📋 متابعة امتحان الطقس</div>
  </div>
  <div class="hdr-right">
    <span class="hdr-user" id="userLabel"></span>
    <span class="cd" id="countdown"></span>
    <button class="hdr-btn" onclick="doLogout()">خروج</button>
  </div>
</div>

<!-- VIEW TABS (admin only) -->
<div class="view-tabs" id="viewTabs" style="display:none;display:flex">
  <button class="vt on" id="vt-data" onclick="switchView('data')">📋 التقديمات</button>
  <button class="vt" id="vt-sum" onclick="switchView('summary')">📊 ملخص إداري</button>
</div>

<!-- CONTROLS -->
<div class="controls" id="controls">
  <div class="lvl-tabs" id="lvlTabs"></div>
  <select class="ch-sel" id="chSel" onchange="applyFilter()"><option value="">كل الكنائس</option></select>
  <input class="srch" id="srch" type="text" placeholder="🔍 اسم أو كود..." oninput="applyFilter()">
  <button class="ref-btn" onclick="loadData()">🔄 تحديث</button>
</div>

<div class="err-msg" id="errMsg"></div>

<!-- KPIs -->
<div class="kpis" id="kpis" style="display:none">
  <div class="kpi"><div class="kpi-n" id="kTotal" style="color:#800000">—</div><div class="kpi-l">إجمالي المقدّمين</div></div>
  <div class="kpi"><div class="kpi-n" id="kChurches" style="color:#c9a227">—</div><div class="kpi-l">عدد الكنائس</div></div>
  <div class="kpi"><div class="kpi-n" id="kLast" style="color:#16A34A">—</div><div class="kpi-l">آخر تقديم</div></div>
</div>

<!-- DATA TABLE -->
<div id="dataView">
  <div class="tcard" id="tcard">
    <div class="tcard-head">
      <div class="tcard-title" id="tTitle">المقدّمون</div>
      <button class="exp-btn" onclick="exportExcel()">⬇ Excel</button>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th style="text-align:center;width:36px">#</th>
          <th>الاسم</th><th>الكنيسة</th>
          <th style="text-align:center">الكود</th>
          <th style="text-align:center">وقت التقديم</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <div class="last-upd" id="lastUpd"></div>
</div>

<!-- SUMMARY -->
<div id="summaryView">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0">
    <div class="kpi"><div class="kpi-n" id="sTotal" style="color:#800000">—</div><div class="kpi-l">إجمالي</div></div>
    <div class="kpi"><div class="kpi-n" id="sMale" style="color:#1A56DB">—</div><div class="kpi-l">👨 شماس</div></div>
    <div class="kpi"><div class="kpi-n" id="sFemale" style="color:#E11D48">—</div><div class="kpi-l">👩 شماسة</div></div>
    <div class="kpi"><div class="kpi-n" id="sUnknown" style="color:#9c7c78">—</div><div class="kpi-l">غير محدد</div></div>
  </div>
  <div class="sum-grid" id="sumGrid"></div>
</div>

<script>
// ══ CONFIG ════════════════════════════════════════════════════
const EXAM_SHEET_ID  = '1rzs48jlN1qzrFiQhn-2Ss3ua23HrwBj6tQVA7Axo7hA';
const USERS_SHEET_ID = '1ZHQcf9XSYx5C2TxXjfmxbNqbsnwe6KC8J-MsLnsUbvI';
const USERS_SHEET    = 'Users';
const TOKEN_TTL      = 12*60*60*1000;
// Ordered array to guarantee RTL tab order
const SHEET_TABS_ORDER = [
  ['1-a','المستوى الأول ألفا'],
  ['1-b','المستوى الأول فيتا'],
  ['2',  'المستوى الثاني'],
  ['3',  'المستوى الثالث'],
  ['4',  'المستوى الرابع'],
];
const SHEET_TABS = Object.fromEntries(SHEET_TABS_ORDER);

// ══ STATE ═════════════════════════════════════════════════════
let user=null, USERS=[], MAINDB={};
let curTab='1-a', allRows=[], filtered=[], prevCount=0;
let timer=null, cdSec=30;

// ══ INIT ══════════════════════════════════════════════════════
(function(){
  const s=localStorage.getItem('exam_user');
  if(s){try{const d=JSON.parse(s);if(Date.now()<d.exp){user=d;afterLogin();return;}}catch{}}
  prefetchUsers();
})();

async function prefetchUsers(){
  try{
    const rows=await readCSV(USERS_SHEET_ID,USERS_SHEET);
    USERS=parseUsers(rows);
  }catch(e){console.warn('prefetch users:',e);}
}

// ══ LOGIN ═════════════════════════════════════════════════════
async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('loginErr');
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  if(!u||!p){showErr('أدخل بيانات الدخول');return;}
  btn.innerHTML='<div class="spin spin-w"></div>'; btn.disabled=true;
  err.style.display='none';
  if(!USERS.length){
    try{const rows=await readCSV(USERS_SHEET_ID,USERS_SHEET);USERS=parseUsers(rows);}
    catch(e){showErr('خطأ في تحميل المستخدمين: '+e.message);btn.innerHTML='🔑 دخول';btn.disabled=false;return;}
  }
  const found=USERS.find(x=>x.username===u&&x.password===p);
  if(found){
    user={...found,exp:Date.now()+TOKEN_TTL};
    localStorage.setItem('exam_user',JSON.stringify(user));
    afterLogin();
  }else{
    showErr('اسم المستخدم أو كلمة السر غلط');
  }
  btn.innerHTML='🔑 دخول'; btn.disabled=false;
}

function showErr(msg){const e=document.getElementById('loginErr');e.textContent=msg;e.style.display='block';}

function doLogout(){
  user=null; localStorage.removeItem('exam_user');
  clearInterval(timer);
  location.reload();
}

function parseUsers(rows){
  return rows.map(r=>{
    const v=Object.values(r);
    return{
      username:String(r.username||r['اسم المستخدم']||v[0]||'').trim(),
      password:String(r.password||r['كلمة السر']||v[1]||'').trim(),
      church:  String(r.church||r['الكنيسة']||v[2]||'').trim(),
      role:    String(r.role||r['الدور']||v[3]||'supervisor').trim().toLowerCase(),
      levels:  String(r.levels||r['المستويات']||v[4]||'').trim(),
      gender:  String(r.gender||r['النوع']||v[5]||'').trim(),
    };
  }).filter(u=>u.username);
}

// ══ AFTER LOGIN ═══════════════════════════════════════════════
function afterLogin(){
  document.getElementById('loginScreen').classList.add('hidden');
  const isAdmin=['admin','super_admin'].includes(user.role);

  // Header
  document.getElementById('userLabel').textContent=
    '👤 '+user.username+(user.church?'  '+user.church:'');

  // Show controls
  document.getElementById('controls').style.display='flex';
  document.getElementById('kpis').style.display='grid';
  document.getElementById('tcard').style.display='block';

  // Admin extras
  if(isAdmin){
    document.getElementById('viewTabs').style.display='flex';
    loadMainDB();
  }

  // Supervisor: hide church filter (auto-filtered)
  if(!isAdmin&&user.church){
    document.getElementById('chSel').style.display='none';
  }

  buildTabs(isAdmin);
  loadData();
  startTimer();
}

// ══ TABS ══════════════════════════════════════════════════════
function buildTabs(isAdmin){
  const wrap=document.getElementById('lvlTabs');
  wrap.innerHTML='';
  const userLevels=user.levels?user.levels.split(',').map(l=>l.trim()).filter(Boolean):null;
  SHEET_TABS_ORDER.forEach(([k,label])=>{
    if(!isAdmin&&userLevels&&!userLevels.includes(k))return;
    const btn=document.createElement('button');
    btn.className='lvl-tab'+(k===curTab?' on':'');
    btn.textContent=label;
    btn.onclick=()=>{
      curTab=k;
      wrap.querySelectorAll('.lvl-tab').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      allRows=[];filtered=[];prevCount=0;
      document.getElementById('tbody').innerHTML='';
      hideErr();
      loadData();
    };
    wrap.appendChild(btn);
  });
}

// ══ VIEW SWITCH ═══════════════════════════════════════════════
function switchView(v){
  document.getElementById('vt-data').classList.toggle('on',v==='data');
  document.getElementById('vt-sum').classList.toggle('on',v==='summary');
  document.getElementById('dataView').style.display=v==='data'?'block':'none';
  document.getElementById('kpis').style.display=v==='data'?'grid':'none';
  document.getElementById('summaryView').style.display=v==='summary'?'block':'none';
  if(v==='summary')renderSummary();
}

// ══ LOAD DATA ═════════════════════════════════════════════════
async function loadData(){
  hideErr();
  try{
    const rows=await readCSV(EXAM_SHEET_ID,curTab);
    parseRows(rows);
    document.getElementById('lastUpd').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
    if(document.getElementById('summaryView').style.display==='block')renderSummary();
  }catch(e){
    showErrMsg('❌ خطأ في التحميل — تأكد إن الشيت منشور للعموم واسم التبويب صح ("'+curTab+'"): '+e.message);
  }
}

function parseRows(rows){
  if(!rows.length){allRows=[];buildChurchFilter();applyFilter();return;}
  const keys=Object.keys(rows[0]);
  const iName  =fk(keys,['الاسم','name','اسم']);
  const iChurch=fk(keys,['الكنيسة','church','كنيسة']);
  const iCode  =fk(keys,['الكود','code','كود']);
  const iTs    =fk(keys,['Timestamp','timestamp','التاريخ','تاريخ']);
  const newRows=rows.map(r=>({
    name:  iName   ?String(r[iName]||'').trim():'—',
    church:iChurch ?String(r[iChurch]||'').trim():'—',
    code:  iCode   ?String(r[iCode]||'').trim():'—',
    ts:    iTs     ?String(r[iTs]||'').trim():'',
  })).filter(r=>r.name&&r.name!=='—');
  const isNew=newRows.length>prevCount&&prevCount>0;
  prevCount=newRows.length;
  allRows=newRows;
  buildChurchFilter();
  applyFilter(isNew);
  updateKPIs();
}

function fk(keys,names){return keys.find(k=>names.some(n=>k.includes(n)))||null;}

// ══ CHURCH FILTER ═════════════════════════════════════════════
function buildChurchFilter(){
  const sel=document.getElementById('chSel');
  const cur=sel.value;
  const isAdmin=['admin','super_admin'].includes(user?.role||'');
  if(!isAdmin){return;}
  const churches=[...new Set(allRows.map(r=>r.church).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  sel.innerHTML='<option value="">كل الكنائس</option>'+churches.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if(cur&&churches.includes(cur))sel.value=cur;
}

// ══ FILTER ════════════════════════════════════════════════════
function applyFilter(markNew=false){
  const isAdmin=['admin','super_admin'].includes(user?.role||'');
  const ch=isAdmin?document.getElementById('chSel').value:(user?.church||'');
  const q=norm(document.getElementById('srch').value||'');
  filtered=allRows.filter(r=>{
    if(ch&&!r.church.includes(ch)&&!ch.includes(r.church))return false;
    if(q&&!norm(r.name).includes(q)&&!r.code.includes(q))return false;
    return true;
  });
  renderTable(markNew);
  const label=ch?('⛪ '+ch):'المقدّمون';
  document.getElementById('tTitle').textContent=label+' ('+filtered.length+')';
}

function updateKPIs(){
  document.getElementById('kTotal').textContent=allRows.length;
  document.getElementById('kChurches').textContent=new Set(allRows.map(r=>r.church).filter(Boolean)).size;
  const last=allRows.length?fmtTime(allRows[allRows.length-1].ts):'—';
  document.getElementById('kLast').textContent=last;
}

// ══ RENDER TABLE ══════════════════════════════════════════════
function renderTable(markNew=false){
  const sorted=[...filtered].reverse();
  document.getElementById('tbody').innerHTML=sorted.length?sorted.map((r,i)=>`
    <tr>
      <td style="text-align:center;color:#9c7c78;font-size:11px">${filtered.length-i}</td>
      <td style="font-weight:800">${esc(r.name)}${markNew&&i===0?'<span class="new-badge">جديد</span>':''}</td>
      <td style="font-size:11px">${esc(r.church)}</td>
      <td style="text-align:center;font-weight:700">${esc(r.code)}</td>
      <td class="tm">${fmtTime(r.ts)}</td>
    </tr>`).join(''):'<tr><td colspan="5" class="empty">لا يوجد بيانات</td></tr>';
}

// ══ SUMMARY ═══════════════════════════════════════════════════
async function loadMainDB(){
  try{
    const rows=await readCSV(USERS_SHEET_ID,'Data');
    rows.forEach(r=>{
      const code=String(r['الكود']||r.code||'').trim();
      if(code)MAINDB[code]={
        gender:String(r['النوع']||r.gender||'').trim(),
        name:String(r['الاسم الكامل']||r['الاسم']||r.name||'').trim(),
        church:String(r['الكنيسة']||r.church||'').trim(),
      };
    });
  }catch(e){console.warn('MainDB:',e);}
}

function renderSummary(){
  if(!allRows.length){document.getElementById('sumGrid').innerHTML='<div style="text-align:center;padding:30px;color:#bbb;font-size:13px;font-weight:700">لا يوجد بيانات — حمّل مستوى أولاً</div>';return;}
  const byChurch={};
  allRows.forEach(r=>{
    const ch=r.church||'غير محدد';
    if(!byChurch[ch])byChurch[ch]={total:0,male:0,female:0,unk:0};
    byChurch[ch].total++;
    const g=(MAINDB[r.code]?.gender||'').toLowerCase();
    if(/ذكر|male|^m$/.test(g))byChurch[ch].male++;
    else if(/أنث|female|^f$/.test(g))byChurch[ch].female++;
    else byChurch[ch].unk++;
  });
  const churches=Object.keys(byChurch).sort((a,b)=>a.localeCompare(b,'ar'));
  const tot=allRows.length;
  const male=Object.values(byChurch).reduce((s,v)=>s+v.male,0);
  const female=Object.values(byChurch).reduce((s,v)=>s+v.female,0);
  document.getElementById('sTotal').textContent=tot;
  document.getElementById('sMale').textContent=male;
  document.getElementById('sFemale').textContent=female;
  document.getElementById('sUnknown').textContent=tot-male-female;
  document.getElementById('sumGrid').innerHTML=churches.map(ch=>{
    const s=byChurch[ch];
    const malePct=s.total?Math.round(s.male/s.total*100):0;
    return`<div class="sum-card">
      <div class="sum-head">
        <div class="sum-church">⛪ ${esc(ch.replace(/كنيسة\s*/,'').slice(0,24))}</div>
        <div style="text-align:center"><div class="sum-total">${s.total}</div><div style="font-size:9px;color:#9c7c78;font-weight:700">مقدّم</div></div>
      </div>
      <div class="sum-bar"><div class="sum-fill" style="width:${malePct}%"></div></div>
      <div class="sum-genders">
        <div class="sum-g"><div class="sum-gn" style="color:#1A56DB">${s.male}</div><div class="sum-gl">👨 شماس</div></div>
        <div class="sum-g"><div class="sum-gn" style="color:#E11D48">${s.female}</div><div class="sum-gl">👩 شماسة</div></div>
      </div>
      ${s.unk?`<div style="font-size:10px;color:#9c7c78;text-align:center;padding:4px">غير محدد: ${s.unk}</div>`:''}
    </div>`;
  }).join('');
}

// ══ EXPORT ════════════════════════════════════════════════════
function exportExcel(){
  if(!filtered.length)return;
  const ws=XLSX.utils.aoa_to_sheet([
    ['#','الاسم','الكنيسة','الكود','وقت التقديم'],
    ...filtered.map((r,i)=>[i+1,r.name,r.church,r.code,fmtTime(r.ts)])
  ]);
  ws['!views']=[{RTL:true}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,SHEET_TABS[curTab]||curTab);
  XLSX.writeFile(wb,'امتحان_'+curTab+'_'+new Date().toLocaleDateString('ar-EG').replace(/\//g,'-')+'.xlsx');
}

// ══ CSV READER ════════════════════════════════════════════════
async function readCSV(id,sheet){
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&_=${Date.now()}`;
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const text=await r.text();
  const lines=text.trim().split('\n').filter(l=>l.trim());
  if(lines.length<2)return[];
  const parse=row=>{
    const res=[];let cur='',inQ=false;
    for(let i=0;i<row.length;i++){
      if(row[i]==='"'&&!inQ)inQ=true;
      else if(row[i]==='"'&&inQ&&row[i+1]==='"'){cur+='"';i++;}
      else if(row[i]==='"'&&inQ)inQ=false;
      else if(row[i]===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=row[i];
    }
    res.push(cur.trim());return res;
  };
  const headers=parse(lines[0]);
  return lines.slice(1).map(line=>{
    const vals=parse(line);
    return Object.fromEntries(headers.map((h,i)=>[h,vals[i]||'']));
  });
}

// ══ TIMER ═════════════════════════════════════════════════════
function startTimer(){
  clearInterval(timer);
  cdSec=30;
  timer=setInterval(()=>{
    cdSec--;
    document.getElementById('countdown').textContent='تحديث خلال '+cdSec+'ث';
    if(cdSec<=0){cdSec=30;loadData();}
  },1000);
}

// ══ HELPERS ═══════════════════════════════════════════════════
function norm(s){return String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtTime(v){
  if(!v)return'—';
  try{const d=new Date(v);if(!isNaN(d))return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}catch{}
  const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(m)return m[4].padStart(2,'0')+':'+m[5];
  return String(v).slice(0,16);
}
function hideErr(){document.getElementById('errMsg').style.display='none';}
function showErrMsg(msg){const e=document.getElementById('errMsg');e.textContent=msg;e.style.display='block';}
